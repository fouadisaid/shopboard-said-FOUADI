<div class="produit-list">
  <h2>Nos produits</h2>

  @if (produits().length === 0) {
    <p>Aucun produit disponible.</p>
  } @else {
    @for (produit of produits(); track produit.id) {
      <app-produit-card [produit]="produit" (ajouterAuPanier)="onAjouterAuPanier($event)">
      </app-produit-card>

      <p>Articles au panier : {{ nombreArticles() }} — Total : {{ totalFormate() }}</p>
    }
  }
</div>
